<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brief</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');
  
  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --card: #161616;
    --border: #242424;
    --accent: #c8a97e;
    --accent2: #e8d5b5;
    --text: #f0ece4;
    --muted: #777;
    --green: #7ecf7e;
    --purple: #c07ed0;
    --blue: #7e9ed0;
    --red: #d07e7e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 32px 44px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 2.2rem;
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .logo span { color: var(--accent); }

  .tagline {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 7px;
  }

  .header-meta {
    text-align: right;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.8;
  }

  .header-meta strong {
    display: block;
    color: var(--accent);
    font-size: 0.82rem;
    font-weight: 500;
  }

  /* TOOLBAR */
  .toolbar {
    padding: 18px 44px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 9px 22px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-primary:hover:not(:disabled) { background: var(--accent2); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

  .divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }

  .filter {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .filter:hover, .filter.on { border-color: var(--accent); color: var(--accent); }

  .count {
    margin-left: auto;
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  /* STATUS */
  .status {
    padding: 0 44px;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s, padding 0.3s;
  }

  .status.on {
    max-height: 50px;
    padding: 12px 44px;
    border-bottom: 1px solid var(--border);
  }

  .status-inner {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .spin {
    width: 13px; height: 13px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* MAIN */
  main { padding: 36px 44px; }

  /* EMPTY */
  .empty {
    text-align: center;
    padding: 90px 24px;
    color: var(--muted);
  }

  .empty-icon {
    font-size: 2.8rem;
    margin-bottom: 20px;
    opacity: 0.35;
    display: block;
  }

  .empty h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 10px;
  }

  .empty p { font-size: 0.83rem; line-height: 1.8; max-width: 340px; margin: 0 auto; }

  /* WEEKLY SUMMARY BOX */
  .week-box {
    border-left: 2px solid var(--accent);
    padding: 18px 22px;
    background: var(--surface);
    margin-bottom: 28px;
    font-size: 0.83rem;
    color: #aaa;
    line-height: 1.8;
  }

  .week-box strong {
    font-family: 'Playfair Display', serif;
    font-size: 0.92rem;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }

  .cats-row {
    display: flex;
    gap: 20px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .cat-stat { font-size: 0.72rem; color: var(--muted); }
  .cat-stat b { font-weight: 600; }

  /* SECTION */
  .section-head {
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2px;
  }

  /* CARDS */
  .grid { display: grid; gap: 2px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 22px 26px;
    transition: border-color 0.2s;
    animation: up 0.35s ease both;
  }

  .card:hover { border-color: #333; }

  @keyframes up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 11px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.02rem;
    font-weight: 700;
    line-height: 1.35;
    flex: 1;
  }

  .badge {
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .badge.ai      { background: #0f1f0f; color: var(--green); }
  .badge.footwear{ background: #1f0f0f; color: var(--red); }
  .badge.luxury  { background: #1a0f1f; color: var(--purple); }
  .badge.tech    { background: #0f0f1f; color: var(--blue); }

  .card-body {
    font-size: 0.82rem;
    color: #999;
    line-height: 1.72;
    margin-bottom: 12px;
  }

  .card-impact {
    font-size: 0.76rem;
    color: #666;
    font-style: italic;
    margin-bottom: 14px;
    line-height: 1.6;
  }

  .card-impact::before { content: "💡 "; font-style: normal; }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .source { font-size: 0.68rem; color: #555; letter-spacing: 0.04em; }

  .read-link {
    font-size: 0.73rem;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
    padding-bottom: 1px;
  }

  .read-link:hover { border-color: var(--accent); }

  /* ERROR */
  .error {
    background: #150a0a;
    border: 1px solid #2a1010;
    padding: 18px 22px;
    font-size: 0.82rem;
    color: #c07070;
    line-height: 1.7;
  }

  @media (max-width: 600px) {
    header, .toolbar, main { padding-left: 20px; padding-right: 20px; }
    .logo { font-size: 1.6rem; }
    header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .header-meta { text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">The <span>Brief</span></div>
    <div class="tagline">IA · Digital Commerce · Calzado · Lujo · Tech</div>
  </div>
  <div class="header-meta" id="metaDate">
    <strong>Sin actualizar</strong>
    Presioná "Actualizar" para cargar<br>las noticias de la semana
  </div>
</header>

<div class="toolbar">
  <button class="btn-primary" id="runBtn" onclick="fetchNews()">↻ Actualizar noticias</button>
  <div class="divider"></div>
  <div class="filters">
    <button class="filter on" onclick="filterBy('all',this)">Todas</button>
    <button class="filter" onclick="filterBy('ai',this)">IA & Commerce</button>
    <button class="filter" onclick="filterBy('footwear',this)">Calzado & Acc.</button>
    <button class="filter" onclick="filterBy('luxury',this)">Lujo Digital</button>
    <button class="filter" onclick="filterBy('tech',this)">Tech</button>
  </div>
  <div class="count" id="count"></div>
</div>

<div class="status" id="status">
  <div class="status-inner">
    <div class="spin"></div>
    <span id="statusMsg">Buscando noticias...</span>
  </div>
</div>

<main id="main">
  <div class="empty">
    <span class="empty-icon">📡</span>
    <h3>Tu agente de noticias está listo</h3>
    <p>Cada vez que presionés "Actualizar", busca en tiempo real las noticias más relevantes de los últimos 7 días.</p>
  </div>
</main>

<script>
let allNews = [];
let activeFilter = 'all';

const SYSTEM = `You are a news research agent. Search the web for the most relevant news from the last 7 days in these categories:
1. AI applied to ecommerce and digital commerce
2. Footwear and accessories industry (Nike, Adidas, luxury footwear, sneakers, retail trends)
3. Luxury digital marketing (LVMH, Kering, Richemont, luxury DTC, brand strategy)
4. AI and technology breakthroughs

After searching, respond with ONLY a raw JSON array. No markdown, no code fences, no explanation before or after. Start your response with [ and end with ].

Each item must follow this exact structure:
{"category":"ai|footwear|luxury|tech","title":"Title in Spanish","summary":"2-3 sentences in Spanish explaining what happened and why it matters for digital business","source":"Source name","url":"real working URL","impact":"One sentence in Spanish: why this changes something concrete in the industry"}

Return 12 to 16 real news items from the last 7 days.`;

async function fetchNews() {
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  const msg = document.getElementById('statusMsg');
  const main = document.getElementById('main');

  btn.disabled = true;
  status.classList.add('on');
  main.innerHTML = '';

  const steps = [
    'Buscando noticias de IA en commerce...',
    'Rastreando calzado y accesorios...',
    'Analizando marketing de lujo digital...',
    'Revisando breakthroughs en tecnología...',
    'Armando tu resumen semanal...'
  ];
  let i = 0;
  msg.textContent = steps[0];
  const interval = setInterval(() => { i = (i+1) % steps.length; msg.textContent = steps[i]; }, 2800);

  try {
    const today = new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    const res = await fetch('https://the-brief-proxy.victoriachazal.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 6000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: SYSTEM,
        messages: [{
          role: 'user',
          content: `Hoy es ${today}. Buscá las noticias más importantes de los últimos 7 días en: IA aplicada a ecommerce, calzado y accesorios de lujo y masivo, marketing digital de marcas de lujo, y avances en IA y tecnología. Devolvé el array JSON.`
        }]
      })
    });

    clearInterval(interval);

    if (!res.ok) {
      const errBody = await res.text();
      throw new Error(`Error ${res.status}: ${errBody.slice(0,200)}`);
    }

    const data = await res.json();

    // Collect all text from all content blocks (including tool results)
    let raw = '';
    for (const block of data.content) {
      if (block.type === 'text') raw += block.text;
      // also check inside tool_result blocks
      if (block.type === 'tool_result' && Array.isArray(block.content)) {
        for (const inner of block.content) {
          if (inner.type === 'text') raw += inner.text;
        }
      }
    }

    // Strip markdown code fences if present
    raw = raw.replace(/```json/gi, '').replace(/```/g, '');

    // Find outermost JSON array
    const start = raw.indexOf('[');
    const end = raw.lastIndexOf(']');
    if (start === -1 || end === -1) throw new Error('La respuesta no contiene un array JSON válido.');

    allNews = JSON.parse(raw.slice(start, end + 1));
    renderAll();

    const now = new Date();
    document.getElementById('metaDate').innerHTML = `
      <strong>Actualizado</strong>
      ${now.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}<br>
      ${now.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}
    `;

  } catch(e) {
    clearInterval(interval);
    document.getElementById('main').innerHTML = `<div class="error">No se pudieron cargar las noticias: ${e.message}<br><br>Intentá de nuevo en unos segundos.</div>`;
  } finally {
    status.classList.remove('on');
    btn.disabled = false;
  }
}

function filterBy(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const filtered = cat === 'all' ? allNews : allNews.filter(n => n.category === cat);
  renderCards(filtered);
}

function renderAll() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  // Summary box
  const ai = allNews.filter(n=>n.category==='ai').length;
  const fw = allNews.filter(n=>n.category==='footwear').length;
  const lx = allNews.filter(n=>n.category==='luxury').length;
  const tc = allNews.filter(n=>n.category==='tech').length;

  const box = document.createElement('div');
  box.className = 'week-box';
  box.innerHTML = `
    <strong>Resumen de la semana</strong>
    ${allNews.length} noticias seleccionadas. Lo más relevante en IA, calzado, lujo y tecnología.
    <div class="cats-row">
      <span class="cat-stat"><b style="color:#7ecf7e">${ai}</b> IA & Commerce</span>
      <span class="cat-stat"><b style="color:#d07e7e">${fw}</b> Calzado & Acc.</span>
      <span class="cat-stat"><b style="color:#c07ed0">${lx}</b> Lujo Digital</span>
      <span class="cat-stat"><b style="color:#7e9ed0">${tc}</b> Tech</span>
    </div>
  `;
  main.appendChild(box);

  const head = document.createElement('div');
  head.className = 'section-head';
  head.textContent = 'Noticias de la semana';
  main.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.id = 'grid';
  main.appendChild(grid);

  renderCards(allNews);
}

function renderCards(list) {
  const grid = document.getElementById('grid');
  if (!grid) return;

  document.getElementById('count').textContent = `${list.length} noticias`;

  if (!list.length) {
    grid.innerHTML = `<div class="empty" style="padding:40px 0"><p>No hay noticias en esta categoría.</p></div>`;
    return;
  }

  const labels = { ai:'IA & Commerce', footwear:'Calzado', luxury:'Lujo Digital', tech:'Tech' };

  grid.innerHTML = list.map((n,i) => `
    <div class="card" style="animation-delay:${i*0.045}s">
      <div class="card-head">
        <div class="card-title">${x(n.title)}</div>
        <span class="badge ${n.category}">${labels[n.category]||n.category}</span>
      </div>
      <div class="card-body">${x(n.summary)}</div>
      ${n.impact ? `<div class="card-impact">${x(n.impact)}</div>` : ''}
      <div class="card-foot">
        <span class="source">${x(n.source||'')}</span>
        ${n.url ? `<a href="${x(n.url)}" target="_blank" rel="noopener" class="read-link">Leer nota →</a>` : ''}
      </div>
    </div>
  `).join('');
}

function x(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
